; ModularSensors PlatformIO Project Configuration File
; The 'default_envs' src/ms_cfg for specific peripherals
; http://docs.platformio.org/page/projectconf.html

[platformio]
description = neilh10/ModularSensors/examples/samd_log_display_mmw
default_envs =seeed_wio_terminal
;default_envs = adafruit_express_M4_eink29
;default_envs = adafruit_pygamer

[common]
;cmn_f_cpu=120000000L ;Default
cmn_f_cpu =  48000000L  ;With USB & Also without USBs
;cmn_f_cpu = 12000000L ; fails on Tty
;cmn_f_cpu =  8000000L ;fails on Tty
cmn_lib_deps =
    ; There are 3 levels of code production
    ; The stream ( rel1_dvlp1m) is used in alpha coding and development
    ;  alpha - see a\samd_log_display_mmw - branch (rel1_dvlp1m) allows editing of a\samd_log_display_mmw AND ModularSensors\src and pulls the libs
    ;  development this platformio.ini as (rel1_dvlp1m) editing of examples\samd_log_display_mmw and for build specifies git (rel1_dvlp1m) ModularSensors, and pulls the libs
    ;  production  which forces a full pull of (release1) examples\samd_log_display_mmw and libs, and builds options as needed.
    ;
    ; For alpha coding,
    ; and periodically when need to update all libs including ModularSensors #rel1_dvlp1m
    ; for clean lib - delete .pio,
    ; pio pkg install  - execute
    ; ?? then recomment below - not any more
    ; ?? then WIOT delete .pio/libdeps/xxx/EnviroDIY_modularSensors to not have conflicts with ../../src
    ; 
    ;https://github.com/neilh10/ModularSensors#release1
    https://github.com/neilh10/ModularSensors#rel1_dvlp1m
;  ^^ Use this when you want to pull from a specific branch 
    ; These are latest beyond EnviroDIY releases
    https://github.com/vshymanskyy/StreamDebugger  ;Debug when needed
    ; StreamDebugger ; Same as above
    https://github.com/neilh10/SensorModbusMaster ; default release1
    ;use above https://github.com/enviroDIY/SensorModbusMaster
    https://github.com/neilh10/Adafruit_INA219.git 
    ; del https://github.com/adafruit/SdFat ;- need adafruit/SdFat for multiple SDx
    ;https://github.com/greiman/SdFat.git ;-
    ;https://github.com/neilh10/EnableInterrupt - old v1.0.0 need v1.1
    ;https://github.com/GreyGnome/EnableInterrupt 
    ; del https://github.com/arduino-libraries/NTPClient - repalced
    ;; see lib_samd_deps for   Adafruit_SPIFlash & Adafruit_TinyUSB_Arduino & Adafruit-GFX-Library Adafruit_NeoPixel
    ; Need extra libs, so enable STD_LIBS on 1st pass enable ModularSensors then build pulling in ref libs,
    ;    
; STD_LIBS pulled in by ModularSensors, needed if not enabling ModularSensors to Historical Ref
    ;https://github.com/soligen2010/Adafruit_ADS1X15
    ;https://github.com/adafruit/Adafruit_AM2315
    ;https://github.com/adafruit/Adafruit_AM2320
    ;https://github.com/adafruit/Adafruit_BME280_Library
    ;https://github.com/adafruit/Adafruit_MPL115A2
    ;https://github.com/adafruit/DHT-sensor-library
    ;https://github.com/adafruit/Adafruit_Sensor
    ;https://github.com/milesburton/Arduino-Temperature-Control-Library ;Pulls in DallasTemperature
    ;https://github.com/neilh10/KellerModbus 
    ;https://github.com/EnviroDIY/KellerModbus
    ;https://github.com/NorthernWidget/MS5803
    ;https://github.com/PaulStoffregen/OneWire
    ;https://github.com/knolleary/pubsubclient.git
    ;bug https://github.com/EnviroDIY/TinyGSM.git ; bug EnviroDIY/ModularSensors/issues 311
    https://github.com/neilh10/TinyGSM.git#rel1 ;Bug fixes over Envirodiy 
    https://github.com/EnviroDIY/YosemitechModbus
    https://github.com/neilh10/Arduino-SDI-12#release1
    ;https://github.com/EnviroDIY/Arduino-SDI-12.git bug with extraWakeTime=10
    ;https://github.com/EnviroDIY/Tally_Library.git#Dev_I2C
    ;
    ;Historical reference 
    ;https://github.com/greiman/SdFat.git ;- need adafruit/SdFat for multiple SDx
    ;https://github.com/neilh10/Arduino-SerialCommand 
    https://github.com/neilh10/InsituModbus
    https://github.com/neilh10/KellerModbus
    martinl1/BMP388_DEV@^1.0.11 ; dissapeared from github.com/MartinL1/BMP388_DEV.git
    https://github.com/sparkfun/SparkFun_BQ27441_Arduino_Library

; Ignore these folders or PlatformIO will double count all the dependencies
; Development: ModularSensors Release1: src ?
; ?? .pioenvs, .piolibdeps, .vscode, include, doc, examples, sensor_tests, compile_tests, pioScripts
cmn_lib_ignore = .git, doc, examples, arduino_update, sensor_tests, 
    ;EnviroDIY_ModularSensors
    EnviroDIY_DS3231
    SensorModbusMaster
    Arduino-SDI-12
    TinyGSM
    Adafruit_INA21

lib_deps_avr = ;Specific Mayfly board goes in [Mayfly]

lib_samd_deps =
    ;https://github.com/adafruit/SdFat
    ;https://github.com/adafruit/Adafruit_SPIFlash  ;~ for wio_terminal need Seed
    https://github.com/adafruit/Adafruit_TinyUSB_Arduino.git#0.8.0 ;Has MIDI after 0.8.0. Requires -DUSE_TINYUSB
    ;https://github.com/adafruit/Adafruit_TinyUSB_Arduino ;Has MIDI post 0.8.0. Requires -DUSE_TINYUSB
    ; custom board https://github.com/neilh10/arduino-mcp23017
    ;https://github.com/neilh10/RTCZero ;- conflict with Seeed_Arduino_RTC\RTC_SAMD51.h ;release1 set as default - see lib\RTCsamdLooUQ
    ; ;except when exists kn_depth\lib\RTClib, delete .pio\libdeps\xx\RTClib
    ;https://github.com/neilh10/RTClib
    ;https://github.com/adafruit/Adafruit-GFX-Library
    ;https://github.com/adafruit/Adafruit_EPD
    ;FUT https://github.com/adafruit/Adafruit_NeoPixel
    ; Can be used on any board except Mayfly1.1 as has similar SHT4x
    https://github.com/adafruit/Adafruit_SHT31

lib_featherExpress_deps =
    https://github.com/adafruit/Adafruit_NeoPixel
    #feather_Mx_express means local flash disk (2Mbyte+) & NeoPixel

lib_wio_terminal_deps =
    ; wio terminal getting new WiFi lib
    ;https://github.com/Seeed-Studio/Seeed_Arduino_atWiFi
    ;https://github.com/Seeed-Studio/Seeed_Arduino_FreeRTOS
    ;https://github.com/Seeed-Studio/Seeed_Arduino_atUnified
    ;https://github.com/Seeed-Studio/esp-at-lib
    ; objective figure out why Seeed_Arduino_RTC is needed and not RTCzero
    https://github.com/neilh10/Seeed_Arduino_RTC
    https://github.com/milesburton/Arduino-Temperature-Control-Library
    https://github.com/Seeed-Studio/Seeed_Arduino_rpcWiFi
    https://github.com/Seeed-Studio/Seeed_Arduino_rpcUnified
    https://github.com/Seeed-Studio/Seeed_Arduino_mbedtls
    https://github.com/Seeed-Studio/Seeed_Arduino_FS
    https://github.com/Seeed-Studio/Seeed_Arduino_SFUD

lib_samd21_deps =    

lib_samd51_deps =
    https://github.com/neilh10/EnableInterrupt   ;release1 set as default
    https://github.com/neilh10/Arduino-SDI-12 ;release1 set as default
    ;https://github.com/adafruit/Adafruit_SPIFlash

; for development, can edit directly in these directories ... relative to src_dir
;  Use the src filter to ensure subfolders are built
