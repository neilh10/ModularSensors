;https://docs.platformio.org/en/latest/projectconf/sections/env/options/advanced/extra_scripts.html#projectconf-extra-scripts
; Errors with two files 
; Transition by adding must_exist=False to SConscript calls.
; Missing SConscript 'build_files_exclude.py post:build_uf2.py'
cmn_arm_extra_scripts = pre:build_files_exclude.py ;post:build_uf2.py 

[env:seeed_wio_terminal]
platform = atmelsam
board = seeed_wio_terminal
framework = arduino
;upload_port = COM13
lib_ldf_mode = deep+
board_build.f_cpu =  ${common.cmn_f_cpu} 

# lib_ignore Std SAMDx AltSoftSerial SoftwareSerial_ExtInts (ignored in SAMD12 Autonomo)
# SensorModbusMaster_ID1824\SensorModbusMaster.cpp.o - M4 Register errors, error: 'REG_GCLK_GENDIV'
# Arduino-SDI-12_ID1486, Arduino-SDI-12\src\SDI12_boards.cpp:171:9: error: 'REG_GCLK_GENDIV' 
# 
lib_ignore = ${common.cmn_lib_ignore}, SoftwareSerial_ExtInts, AltSoftSerial, MaximDS3231, EnviroDIY_DS3231,  NeoSWSerial, SdFat
  #,SdFat  # need to use - Adafruit Fork\src\SdFatConfig.h

build_src_filter = 
    ${common.cmn_src_filter} 

;https://docs.platformio.org/en/latest/scripting/examples/platformio_ini_custom_options.html
;List as unique path as is needed eg
; \.pio\libdeps\seeed_wio_terminal\EnviroDIY_ModularSensors\src\sensors\MaximDS3231.cpp
; *\src\sensors\MaximDS3231.cpp
custom_build_files_exclude = *\MaximDS3231.cpp *\STSTC3100_Sensor.cpp *\SensirionSHT4x.cpp


#build_flags = -v
# SERIAL2_EN fut:SERIAL2_TE_EN  - only enable when modbusSerial required
# SERIAL3_EN
# SERIAL4_EN fut:SERIAL4_TE_EN  - Tty
build_flags =  ;-v ;review for WIO
    ${common.cmn_build_flags}
    ;-DUSE_RTCLIB=RTC_DS3231 ; or USR_EXTRTCPHY
    ;-UVARIANT_QSPI_BAUD_DEFAULT ;prev def cmd line, also variant.h
    ;-DSDQ_QSPI_FLASH ;HAS W25Q32JVZPIM
    #!more build_flags
    ;Default USB Serial and USE_TINYUSB or specify USE_SERIAL1   
    ;-DUSE_SERIAL1
    ;needed if Seeed WioT which uses Adafruit_TinyUSB_Arduino
    -DUSE_TINYUSB 
    ;-DSTANDARD_SERIAL_OUTPUT=Serial1
    ;-DDEBUGGING_SERIAL_OUTPUT=Serial1
    ;-DDEEP_DEBUGGING_SERIAL_OUTPUT=Serial1
    ;-DCFG_TUSB_DEBUG
    ;-DWIRING_DIGITAL_DEBUG ;still can't connect debug

lib_deps=  ${common.cmn_lib_deps}  ${common.lib_samd_deps} ${common.lib_wio_terminal_deps} ${common.lib_samd51_deps}
extra_scripts = ${common.cmn_arm_extra_scripts} 

